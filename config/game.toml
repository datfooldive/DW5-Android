# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
CDevice_KickOff = ["edx"]  # reads edx, pops 0
CDevice_KickOffAndWait = ["eax"]  # device in eax, pops 0
D3DDevice_DrawVertices = ["stack", "ecx", "eax"]  # primitive on the stack, start vertex ecx, count eax
D3DDevice_SelectVertexShader = ["eax", "ebx"]
D3DDevice_SetPixelShader = ["eax"]
D3DDevice_SetShaderConstantMode = ["eax"]
D3DDevice_SetTexture = ["eax", "stack"]  # stage eax, texture pushed
D3DDevice_SetTextureState_TexCoordIndex = ["esi", "stack"]  # stage esi, value pushed
D3DDevice_SetTransform = ["eax", "edx"]  # state eax, matrix edx
D3DDevice_Swap = ["eax"]
D3DResource_IsBusy = ["ecx"]
D3D_InternalRelease = ["esi"]
D3D_MakeRequestedSpace = ["stack", "eax"]
Direct3D_CreateDevice = ["eax", "edx", "ebx", "esi", "stack", "ecx"]  # present params pushed, device out ecx

# The analysis split the device release helper at 0x13EE6, six bytes into it: 0x13EE0 opens with
# push ebx; mov ebx, ecx, so a call to 0x13EE0 landed past the prologue and tore the device down
# with a stale ebx on the second viewport of every frame.
[[function]]
at = 0x0013EE0
